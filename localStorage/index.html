<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="container">

        <header class="page-header">
            <div class="header-icon">🎓</div>
            <h1>Student <span>Records</span></h1>
            <p>Manage your student data with ease</p>
        </header>

        <div class="form-card">
            <div class="form-title">
                <span class="form-badge">NEW ENTRY</span>
                <h2>Add Student</h2>
            </div>

            <form action="" id="stuForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="stuName">Full Name</label>
                        <div class="input-wrap">
                            <span class="input-icon">👤</span>
                            <input type="text" id="stuName" placeholder="e.g. Arjun Sharma">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="stuEmail">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="stuEmail" placeholder="e.g. arjun@email.com">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="stuAge">Age</label>
                        <div class="input-wrap">
                            <span class="input-icon">🎂</span>
                            <input type="number" id="stuAge" placeholder="e.g. 17" min="5" max="30">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="stdClass">Class</label>
                        <div class="input-wrap">
                            <span class="input-icon">📚</span>
                            <input type="number" id="stdClass" placeholder="e.g. 10" min="1" max="12">
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Add Student</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
            </form>
        </div>

        <div class="table-section">
            <div class="table-header">
                <h2>All Students</h2>
                <span class="student-count" id="studentCount">0 students</span>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Class</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stuData">
                    </tbody>
                </table>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📋</div>
                    <p>No students added yet.<br>Fill the form above to get started!</p>
                </div>
            </div>
        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
