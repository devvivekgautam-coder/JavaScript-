<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>

    <!-- Bootstrap CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <form action="" id="form">
            <div class="row">
                <div class="col-6">
                    <label for="fName" class="fs-3 text-success">First Name : </label>
                    <input type="text" id="fName" class="form-control my-3 fs-4">
                </div>

                <div class="col-6">
                    <label for="lName" class="fs-3 text-success">Last Name : </label>
                    <input type="text" id="lName" class="form-control my-3 fs-4">
                </div>

                <div class="col-6">
                    <label for="email" class="fs-3 text-success">Email : </label>
                    <input type="email" id="email" class="form-control my-3 fs-4">
                </div>

                <div class="col-6">
                    <label for="phone" class="fs-3 text-success">Mobile No. : </label>
                    <input type="tel" id="phone" class="form-control my-3 fs-4">
                </div>

                <div class="col-6">
                    <label for="pass" class="fs-3 text-success">Password : </label>
                    <input type="password" id="pass" class="form-control my-3 fs-4">
                </div>

                <div class="col-6">
                    <label for="cpass" class="fs-3 text-success">Confirm Password : </label>
                    <input type="password" id="cpass" class="form-control my-3 fs-4">
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-primary fs-2">Submit</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById("form").addEventListener("submit", (e) => {
            e.preventDefault();

            let fName = document.getElementById("fName").value;
            let lName = document.getElementById("lName").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let pass = document.getElementById("pass").value;
            let cpass = document.getElementById("cpass").value;

            if (fName.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Enter First Name!",
                });
                return;
            }

            if (lName.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Enter Last Name!",
                });
                return;
            }

            if (email.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Enter Your Email!",
                });
                return;
            }

            if (phone.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Enter Your Phone Number!",
                });
                return;
            }

            if (pass.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Enter A Password!",
                });
                return;
            }

            if (cpass.trim() === "") {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Confirm Your Password!",
                });
                return;
            }

            if (pass !== cpass) {
                Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Please Confirm Your Password!",
                });
                return;
            }

            Swal.fire({
                title: "Submit Successfully.",
                icon: "success"
            });
        })
    </script>
</body>

</html>
