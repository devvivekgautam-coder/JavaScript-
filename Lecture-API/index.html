            return new Promise((resolve, reject) => {

                setTimeout(() => {
                    if (isRec) {
                        resolve("Yes");
                    } else {
                        reject("No");
                    }
                }, 1000);
            });
        }

        async function run() {
            try {

                console.log(err);
            }
        }
        run();
