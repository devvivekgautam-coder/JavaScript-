<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <h1>Factorial</h1>
    <h2 id="num"></h2>
    <h2 id="fact"></h2>

    <script>
        let num = Number(prompt("Enter any Number : "));
        document.getElementById("num").innerText = `Number : ${num}`;

        let fact = 1;
        for (let i = 1; i <=num; i++) {
            fact *= i;
            document.getElementById("fact").innerText = `Factorial : ${fact}`;
        }
    </script>
</body>
</html>
