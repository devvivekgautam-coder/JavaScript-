<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add To Cart</title>

    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <section>
        <form class="formSection" id="form">

            <div class="text-center d-block justify-content-center">
                <input type="text" id="name" placeholder="Product Name" class="mb-3">
                <br>
                <input type="text" id="price" placeholder="Price" class="mb-3">
                <br>
                <input type="text" id="imageUrl" placeholder="Image URL" class="mb-3">
                <br>
                <button id="btn">Submit</button>
            </div>

        </form>
    </section>

    <script src="./assets/js/bootstrap.min.js"></script>

    <script src="./assets/js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
